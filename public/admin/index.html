<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sawik Admin</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; }
body { background: #f0f2f5; min-height: 100vh; }
.topbar { background: #3730a3; color: white; padding: 14px 24px; display: flex; justify-content: space-between; align-items: center; }
.topbar h1 { font-size: 18px; font-weight: 600; }
.topbar-actions { display: flex; gap: 10px; }
.topbar button { background: rgba(255,255,255,0.2); border: none; color: white; padding: 6px 14px; border-radius: 8px; cursor: pointer; font-size: 13px; }
.topbar .btn-add { background: #4ade80; color: #14532d; font-weight: 600; }
.login-wrap { display: flex; align-items: center; justify-content: center; min-height: 100vh; }
.login-card { background: white; border-radius: 16px; padding: 40px; width: 340px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); }
.login-card h2 { font-size: 22px; margin-bottom: 8px; color: #1e1b4b; }
.login-card p { color: #6b7280; font-size: 13px; margin-bottom: 24px; }
.form-group { margin-bottom: 16px; }
.form-group label { display: block; font-size: 13px; color: #374151; margin-bottom: 6px; font-weight: 500; }
.form-group input, .form-group select { width: 100%; padding: 10px 14px; border: 1px solid #e5e7eb; border-radius: 8px; font-size: 14px; outline: none; }
.form-group input:focus, .form-group select:focus { border-color: #6366f1; }
.btn-primary { width: 100%; background: #4f46e5; color: white; border: none; padding: 12px; border-radius: 8px; font-size: 15px; cursor: pointer; font-weight: 500; }
.btn-primary:hover { background: #4338ca; }
.error { color: #dc2626; font-size: 13px; margin-top: 8px; text-align: center; }
.success { color: #16a34a; font-size: 13px; margin-top: 8px; text-align: center; }
.dashboard { display: none; }
.content { max-width: 1100px; margin: 24px auto; padding: 0 16px; }
.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 12px; margin-bottom: 24px; }
.stat { background: white; border-radius: 12px; padding: 16px; box-shadow: 0 1px 4px rgba(0,0,0,0.06); }
.stat-label { font-size: 12px; color: #6b7280; margin-bottom: 4px; }
.stat-val { font-size: 28px; font-weight: 600; }
.stat-val.indigo { color: #4f46e5; }
.stat-val.green { color: #16a34a; }
.stat-val.blue { color: #2563eb; }
.stat-val.red { color: #dc2626; }
.card { background: white; border-radius: 12px; box-shadow: 0 1px 4px rgba(0,0,0,0.06); overflow: hidden; }
.card-header { padding: 16px 20px; border-bottom: 1px solid #f3f4f6; display: flex; justify-content: space-between; align-items: center; }
.card-header h3 { font-size: 15px; font-weight: 600; color: #111827; }
.search-input { padding: 7px 12px; border: 1px solid #e5e7eb; border-radius: 8px; font-size: 13px; outline: none; width: 200px; }
table { width: 100%; border-collapse: collapse; }
th { background: #f9fafb; padding: 10px 16px; text-align: left; font-size: 12px; color: #6b7280; font-weight: 500; border-bottom: 1px solid #f3f4f6; }
td { padding: 12px 16px; font-size: 13px; border-bottom: 1px solid #f9fafb; color: #111827; }
tr:last-child td { border-bottom: none; }
tr:hover td { background: #fafafa; }
.badge { padding: 3px 10px; border-radius: 20px; font-size: 11px; font-weight: 500; display: inline-block; }
.badge-actif { background: #dcfce7; color: #16a34a; }
.badge-essai { background: #fef3c7; color: #d97706; }
.badge-expire { background: #fee2e2; color: #dc2626; }
.badge-suspendu { background: #f3f4f6; color: #6b7280; }
.badge-pro { background: #eff6ff; color: #2563eb; }
.badge-gratuit { background: #f3f4f6; color: #6b7280; }
.btn-action { padding: 5px 10px; border-radius: 6px; font-size: 11px; cursor: pointer; border: 1px solid #e5e7eb; background: white; margin-right: 3px; }
.btn-action:hover { background: #f3f4f6; }
.btn-danger { border-color: #fca5a5; color: #dc2626; }
.btn-danger:hover { background: #fef2f2; }
.btn-warning { border-color: #fcd34d; color: #d97706; }
.btn-warning:hover { background: #fffbeb; }
.modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.4); display: flex; align-items: center; justify-content: center; z-index: 100; }
.modal { background: white; border-radius: 16px; padding: 28px; width: 400px; box-shadow: 0 8px 40px rgba(0,0,0,0.15); max-height: 90vh; overflow-y: auto; }
.modal h3 { font-size: 17px; font-weight: 600; margin-bottom: 20px; color: #1e1b4b; }
.modal select, .modal input { width: 100%; padding: 9px 12px; border: 1px solid #e5e7eb; border-radius: 8px; font-size: 14px; margin-bottom: 14px; outline: none; }
.modal label { display: block; font-size: 12px; color: #6b7280; margin-bottom: 4px; font-weight: 500; }
.modal-actions { display: flex; gap: 10px; justify-content: flex-end; margin-top: 8px; }
.btn-cancel { padding: 8px 18px; border: 1px solid #e5e7eb; border-radius: 8px; background: white; cursor: pointer; font-size: 14px; }
.btn-save { padding: 8px 18px; background: #4f46e5; color: white; border: none; border-radius: 8px; cursor: pointer; font-size: 14px; }
.btn-save.green { background: #16a34a; }
.hidden { display: none !important; }
.loading { text-align: center; padding: 40px; color: #6b7280; }
.msg { font-size: 13px; margin-top: 10px; text-align: center; }
.msg.ok { color: #16a34a; }
.msg.err { color: #dc2626; }
</style>
</head>
<body>

<div id="login-page" class="login-wrap">
  <div class="login-card">
    <h2>Sawik Admin</h2>
    <p>Connectez-vous pour gérer les abonnements</p>
    <div class="form-group">
      <label>Téléphone</label>
      <input type="text" id="tel" placeholder="0000000000">
    </div>
    <div class="form-group">
      <label>Mot de passe</label>
      <input type="password" id="mdp" placeholder="••••••••">
    </div>
    <button class="btn-primary" onclick="seConnecter()">Se connecter</button>
    <div id="login-error" class="error"></div>
  </div>
</div>

<div id="dashboard-page" class="dashboard">
  <div class="topbar">
    <h1>Sawik Admin</h1>
    <div class="topbar-actions">
      <button class="btn-add" onclick="ouvrirModalAjout()">+ Ajouter utilisateur</button>
      <button onclick="seDeconnecter()">Déconnexion</button>
    </div>
  </div>
  <div class="content">
    <div class="stats">
      <div class="stat"><div class="stat-label">Total utilisateurs</div><div class="stat-val indigo" id="s-total">—</div></div>
      <div class="stat"><div class="stat-label">Actifs</div><div class="stat-val green" id="s-actifs">—</div></div>
      <div class="stat"><div class="stat-label">Plan Pro</div><div class="stat-val blue" id="s-pro">—</div></div>
      <div class="stat"><div class="stat-label">Expirés</div><div class="stat-val red" id="s-expires">—</div></div>
    </div>
    <div class="card">
      <div class="card-header">
        <h3>Utilisateurs</h3>
        <input class="search-input" type="text" placeholder="Rechercher..." oninput="filtrer(this.value)">
      </div>
      <div id="table-wrap">
        <div class="loading">Chargement...</div>
      </div>
    </div>
  </div>
</div>

<!-- Modal abonnement -->
<div id="modal-abo" class="modal-overlay hidden">
  <div class="modal">
    <h3 id="modal-abo-titre">Modifier abonnement</h3>
    <label>Plan</label>
    <select id="m-plan">
      <option value="Gratuit">Gratuit</option>
      <option value="Essai">Essai</option>
      <option value="Pro">Pro</option>
    </select>
    <label>Statut</label>
    <select id="m-statut">
      <option value="Actif">Actif</option>
      <option value="Essai">Essai</option>
      <option value="Expiré">Expiré</option>
      <option value="Suspendu">Suspendu</option>
    </select>
    <label>Date de fin</label>
    <input type="date" id="m-datefin">
    <div class="modal-actions">
      <button class="btn-cancel" onclick="fermerModals()">Annuler</button>
      <button class="btn-save" onclick="sauvegarderAbo()">Enregistrer</button>
    </div>
  </div>
</div>

<!-- Modal mot de passe -->
<div id="modal-mdp" class="modal-overlay hidden">
  <div class="modal">
    <h3 id="modal-mdp-titre">Changer le mot de passe</h3>
    <label>Nouveau mot de passe</label>
    <input type="password" id="m-mdp" placeholder="Minimum 4 caractères">
    <label>Confirmer</label>
    <input type="password" id="m-mdp2" placeholder="Répéter le mot de passe">
    <div id="mdp-msg" class="msg"></div>
    <div class="modal-actions">
      <button class="btn-cancel" onclick="fermerModals()">Annuler</button>
      <button class="btn-save green" onclick="sauvegarderMdp()">Changer</button>
    </div>
  </div>
</div>

<!-- Modal ajouter utilisateur -->
<div id="modal-ajout" class="modal-overlay hidden">
  <div class="modal">
    <h3>Ajouter un utilisateur</h3>
    <label>Nom</label>
    <input type="text" id="a-nom" placeholder="Nom">
    <label>Prénom</label>
    <input type="text" id="a-prenom" placeholder="Prénom (optionnel)">
    <label>Téléphone</label>
    <input type="text" id="a-tel" placeholder="Ex: 66112233">
    <label>Mot de passe</label>
    <input type="password" id="a-mdp" placeholder="Minimum 4 caractères">
    <label>Rôle</label>
    <select id="a-role">
      <option value="user">Utilisateur</option>
      <option value="admin">Admin</option>
    </select>
    <div id="ajout-msg" class="msg"></div>
    <div class="modal-actions">
      <button class="btn-cancel" onclick="fermerModals()">Annuler</button>
      <button class="btn-save green" onclick="ajouterUtilisateur()">Créer</button>
    </div>
  </div>
</div>

<script>
const API = 'https://pos-tchad-api-production.up.railway.app/api';
let token = localStorage.getItem('admin_token') || '';
let utilisateurs = [];
let editingId = null;

async function seConnecter() {
  const tel = document.getElementById('tel').value;
  const mdp = document.getElementById('mdp').value;
  document.getElementById('login-error').textContent = '';
  try {
    const res = await fetch(`${API}/login`, {
      method: 'POST',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify({telephone: tel, mot_de_passe: mdp})
    });
    const data = await res.json();
    if (data.token && data.user.role === 'admin') {
      token = data.token;
      localStorage.setItem('admin_token', token);
      afficherDashboard();
    } else {
      document.getElementById('login-error').textContent = 'Accès refusé — compte admin requis';
    }
  } catch(e) {
    document.getElementById('login-error').textContent = 'Erreur de connexion';
  }
}

function seDeconnecter() {
  token = '';
  localStorage.removeItem('admin_token');
  document.getElementById('login-page').style.display = 'flex';
  document.getElementById('dashboard-page').style.display = 'none';
}

async function afficherDashboard() {
  document.getElementById('login-page').style.display = 'none';
  document.getElementById('dashboard-page').style.display = 'block';
  await chargerStats();
  await chargerUtilisateurs();
}

async function chargerStats() {
  const res = await fetch(`${API}/admin/statistiques`, {headers: {'Authorization':'Bearer '+token}});
  const data = await res.json();
  document.getElementById('s-total').textContent = data.total;
  document.getElementById('s-actifs').textContent = data.actifs;
  document.getElementById('s-pro').textContent = data.pro;
  document.getElementById('s-expires').textContent = data.expires;
}

async function chargerUtilisateurs() {
  const res = await fetch(`${API}/admin/utilisateurs`, {headers: {'Authorization':'Bearer '+token}});
  const data = await res.json();
  utilisateurs = data.utilisateurs || [];
  renderTable(utilisateurs);
}

function badgeStatut(s) {
  const map = {Actif:'badge-actif', Essai:'badge-essai', Expiré:'badge-expire', Suspendu:'badge-suspendu'};
  return `<span class="badge ${map[s]||'badge-gratuit'}">${s||'Aucun'}</span>`;
}
function badgePlan(p) {
  return `<span class="badge ${p==='Pro'?'badge-pro':'badge-gratuit'}">${p||'Gratuit'}</span>`;
}

function renderTable(data) {
  if (!data.length) {
    document.getElementById('table-wrap').innerHTML = '<div class="loading">Aucun utilisateur</div>';
    return;
  }
  const rows = data.map(u => {
    const ab = u.abonnement || {};
    const actif = u.actif;
    return `<tr>
      <td><strong>${u.nom} ${u.prenom}</strong></td>
      <td>${u.telephone}</td>
      <td>${u.role === 'admin' ? '<span class="badge badge-pro">Admin</span>' : '<span class="badge badge-gratuit">User</span>'}</td>
      <td>${badgePlan(ab.plan)}</td>
      <td>${badgeStatut(ab.statut)}</td>
      <td style="color:#6b7280">${ab.date_fin ? ab.date_fin.substring(0,10) : '—'}</td>
      <td>
        <button class="btn-action" onclick="ouvrirModalAbo(${u.id},'${u.nom}')">Abonnement</button>
        <button class="btn-action btn-warning" onclick="ouvrirModalMdp(${u.id},'${u.nom}')">Mot de passe</button>
        <button class="btn-action btn-danger" onclick="suspendre(${u.id})">${actif?'Suspendre':'Activer'}</button>
      </td>
    </tr>`;
  }).join('');
  document.getElementById('table-wrap').innerHTML = `
    <table>
      <thead><tr><th>Nom</th><th>Téléphone</th><th>Rôle</th><th>Plan</th><th>Statut</th><th>Expiration</th><th>Actions</th></tr></thead>
      <tbody>${rows}</tbody>
    </table>`;
}

function filtrer(q) {
  const f = utilisateurs.filter(u =>
    u.nom.toLowerCase().includes(q.toLowerCase()) ||
    u.telephone.includes(q)
  );
  renderTable(f);
}

function fermerModals() {
  document.getElementById('modal-abo').classList.add('hidden');
  document.getElementById('modal-mdp').classList.add('hidden');
  document.getElementById('modal-ajout').classList.add('hidden');
  editingId = null;
}

function ouvrirModalAbo(id, nom) {
  editingId = id;
  const u = utilisateurs.find(x => x.id === id);
  const ab = u.abonnement || {};
  document.getElementById('modal-abo-titre').textContent = 'Abonnement — ' + nom;
  document.getElementById('m-plan').value = ab.plan || 'Gratuit';
  document.getElementById('m-statut').value = ab.statut || 'Actif';
  document.getElementById('m-datefin').value = ab.date_fin ? ab.date_fin.substring(0,10) : '';
  document.getElementById('modal-abo').classList.remove('hidden');
}

async function sauvegarderAbo() {
  const body = {
    plan: document.getElementById('m-plan').value,
    statut: document.getElementById('m-statut').value,
    date_fin: document.getElementById('m-datefin').value || null,
    date_debut: new Date().toISOString().substring(0,10),
  };
  await fetch(`${API}/admin/utilisateurs/${editingId}/abonnement`, {
    method: 'PUT',
    headers: {'Authorization':'Bearer '+token,'Content-Type':'application/json'},
    body: JSON.stringify(body)
  });
  fermerModals();
  chargerStats();
  chargerUtilisateurs();
}

function ouvrirModalMdp(id, nom) {
  editingId = id;
  document.getElementById('modal-mdp-titre').textContent = 'Mot de passe — ' + nom;
  document.getElementById('m-mdp').value = '';
  document.getElementById('m-mdp2').value = '';
  document.getElementById('mdp-msg').textContent = '';
  document.getElementById('modal-mdp').classList.remove('hidden');
}

async function sauvegarderMdp() {
  const mdp = document.getElementById('m-mdp').value;
  const mdp2 = document.getElementById('m-mdp2').value;
  const msg = document.getElementById('mdp-msg');
  if (mdp.length < 4) { msg.className='msg err'; msg.textContent='Minimum 4 caractères'; return; }
  if (mdp !== mdp2) { msg.className='msg err'; msg.textContent='Les mots de passe ne correspondent pas'; return; }
  const res = await fetch(`${API}/admin/utilisateurs/${editingId}/password`, {
    method: 'PUT',
    headers: {'Authorization':'Bearer '+token,'Content-Type':'application/json'},
    body: JSON.stringify({mot_de_passe: mdp})
  });
  const data = await res.json();
  if (res.ok) {
    msg.className='msg ok'; msg.textContent='Mot de passe modifié !';
    setTimeout(fermerModals, 1200);
  } else {
    msg.className='msg err'; msg.textContent = data.message || 'Erreur';
  }
}

function ouvrirModalAjout() {
  document.getElementById('a-nom').value = '';
  document.getElementById('a-prenom').value = '';
  document.getElementById('a-tel').value = '';
  document.getElementById('a-mdp').value = '';
  document.getElementById('a-role').value = 'user';
  document.getElementById('ajout-msg').textContent = '';
  document.getElementById('modal-ajout').classList.remove('hidden');
}

async function ajouterUtilisateur() {
  const msg = document.getElementById('ajout-msg');
  const body = {
    nom: document.getElementById('a-nom').value,
    prenom: document.getElementById('a-prenom').value,
    telephone: document.getElementById('a-tel').value,
    mot_de_passe: document.getElementById('a-mdp').value,
    role: document.getElementById('a-role').value,
  };
  if (!body.nom || !body.telephone || !body.mot_de_passe) {
    msg.className='msg err'; msg.textContent='Nom, téléphone et mot de passe requis'; return;
  }
  const res = await fetch(`${API}/admin/utilisateurs/creer`, {
    method: 'POST',
    headers: {'Authorization':'Bearer '+token,'Content-Type':'application/json'},
    body: JSON.stringify(body)
  });
  const data = await res.json();
  if (res.ok) {
    msg.className='msg ok'; msg.textContent='Utilisateur créé !';
    setTimeout(() => { fermerModals(); chargerStats(); chargerUtilisateurs(); }, 1200);
  } else {
    msg.className='msg err'; msg.textContent = data.message || 'Erreur';
  }
}

async function suspendre(id) {
  await fetch(`${API}/admin/utilisateurs/${id}/suspendre`, {
    method: 'PUT',
    headers: {'Authorization':'Bearer '+token}
  });
  chargerStats();
  chargerUtilisateurs();
}

if (token) afficherDashboard();
document.getElementById('mdp').addEventListener('keypress', e => {
  if (e.key === 'Enter') seConnecter();
});
</script>
</body>
</html>
